services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: afribench-backend
    ports:
      - "8080:8080"
    environment:
      AFRIBENCH_CORS_ORIGINS: "http://localhost:8000,http://127.0.0.1:8000,http://localhost:3000,http://127.0.0.1:3000,http://localhost,http://frontend"
    volumes:
      # Live reload des données d'évaluation
      - ./data:/app/data:ro
      - ./frontend/data:/app/frontend/data:ro
      - ./configs:/app/configs:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: afribench-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

# AfriBench — toutes les catégories
# Prérequis : python scripts/export_lm_eval_dataset.py
#
# lm_eval --model openai-chat-completions \
#   --model_args model=gpt-4o,base_url=https://api.openai.com/v1 \
#   --tasks afribench \
#   --include_path scripts/lm_eval_tasks/ \
#   --num_fewshot 0

task: afribench
dataset_path: json
dataset_kwargs:
  data_files:
    test: data/lm_eval/afribench.json
test_split: test
output_type: multiple_choice
doc_to_text: !function utils.doc_to_text
doc_to_choice: !function utils.doc_to_choice
doc_to_target: !function utils.doc_to_target
metric_list:
  - metric: acc
    aggregation: mean
    higher_is_better: true
metadata:
  version: 0.1
  name: AfriBench
  description: Benchmark LLM sur les réalités africaines (francophone, QCM)
  languages:
    - fr
  contributor: YTILIKAN

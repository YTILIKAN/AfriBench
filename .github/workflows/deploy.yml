name: Deploy to Railway

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: railway-deploy
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'configs/**'
              - 'data/**'
              - 'scripts/**'
              - 'railway.backend.toml'
            frontend:
              - 'frontend/**'
              - 'railway.frontend.toml'

  deploy-backend:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Railway CLI
        run: npm install -g @railway/cli
      - name: Deploy backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: cp railway.backend.toml railway.toml && railway up -c -s afribench-api

  deploy-frontend:
    runs-on: ubuntu-latest
    needs: [changes, deploy-backend]
    # Redéploie le frontend si le frontend OU le backend a changé :
    # un redéploiement backend fait tourner son IP privée → nginx doit re-résoudre.
    if: |
      always() &&
      needs.changes.result == 'success' &&
      (needs.changes.outputs.frontend == 'true' || needs.changes.outputs.backend == 'true')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Railway CLI
        run: npm install -g @railway/cli
      - name: Deploy frontend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: cp railway.frontend.toml railway.toml && railway up -c -s afribench-web

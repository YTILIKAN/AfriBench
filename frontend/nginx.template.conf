server {
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Resolver généré au démarrage depuis /etc/resolv.conf (DNS interne Railway/Docker)
    include /etc/nginx/conf.d/resolver.conf;

    # SPA / static assets
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API → backend. L'upstream passe par une VARIABLE : nginx ne le résout
    # qu'à la requête (via le resolver), donc le conteneur démarre même si le
    # backend est absent ou injoignable — le site statique reste servi.
    location /api/ {
        set $backend "${BACKEND_URL}";
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /docs {
        set $backend "${BACKEND_URL}";
        proxy_pass $backend;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        set $backend "${BACKEND_URL}";
        proxy_pass $backend;
        proxy_set_header Host $host;
    }
}

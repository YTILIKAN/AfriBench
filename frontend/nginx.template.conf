server {
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Resolver généré au démarrage depuis /etc/resolv.conf (DNS interne Railway/Docker)
    include /etc/nginx/conf.d/resolver.conf;

    # L'image nginx livre gzip désactivé : sans cette section, le bundle JS et la
    # feuille de style partent non compressés (~380 Ko au lieu de ~110 Ko).
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/xml
        image/svg+xml
        text/css
        text/plain
        text/xml;

    # En-têtes de sécurité. La CSP est la défense en profondeur qui contient une
    # injection dans du contenu rendu via innerHTML.
    # Attention : un `add_header` dans un bloc location annule ceux héritées du
    # parent. Les blocs ci-dessous n'utilisent donc que `expires`, jamais
    # `add_header`, pour ne pas perdre ces en-têtes.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # SPA / static assets
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Les noms de fichiers produits par Vite portent un hash de contenu : ils
    # peuvent donc être mis en cache très longtemps.
    location /assets/ {
        expires 1y;
    }

    # Le document d'entrée doit toujours être revalidé, pour que le déploiement
    # suivant soit visible immédiatement.
    location = /index.html {
        expires -1;
    }

    # Le backoffice porte encore son CSS et son JS en ligne, et charge ses
    # polices depuis Google Fonts : il lui faut une politique distincte, plus
    # permissive. À supprimer dès que /admin passe par le build Vite.
    location /admin/ {
        expires -1;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Proxy API → backend. L'upstream passe par une VARIABLE : nginx ne le résout
    # qu'à la requête (via le resolver), donc le conteneur démarre même si le
    # backend est absent ou injoignable — le site statique reste servi.
    location /api/ {
        set $backend "${BACKEND_URL}";
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /docs {
        set $backend "${BACKEND_URL}";
        proxy_pass $backend;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        set $backend "${BACKEND_URL}";
        proxy_pass $backend;
        proxy_set_header Host $host;
    }
}
